# En-tetes de securite communs (inclus dans chaque location : un add_header local efface ceux du bloc server)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Politique de contenu : tout vient du site, sauf les imports de parties (Lichess, chess.com) faits depuis le navigateur.
# 'wasm-unsafe-eval' : moteur Stockfish (WebAssembly). style-src 'unsafe-inline' : styles en ligne de React.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://lichess.org https://api.chess.com; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# HTTPS uniquement (a activer quand le site est servi en HTTPS, sinon le navigateur refusera le HTTP pendant 1 an)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
